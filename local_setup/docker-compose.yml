version: '3'

services:

  # main bolna service
  bolna-app:
    build:
      context: .
      dockerfile: dockerfiles/bolna_server.Dockerfile
    image: bolna-app:latest
    ports:
      - "5001:5001"
    depends_on:
      - redis
    restart: always
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - BOLNA_API_KEY=${BOLNA_API_KEY:-}
      - SARVAM_API_KEY=${SARVAM_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPGRAM_AUTH_TOKEN=${DEEPGRAM_AUTH_TOKEN:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
    volumes:
      - ../agent_data:/app/agent_data

  # redis service used as a persistent storage
  redis:
    image: redis:latest
    restart: always
    ports:
      - "6379:6379"

  # Optional ngrok for local tunneling (disabled on VPS/Coolify)
